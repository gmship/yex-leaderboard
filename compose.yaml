services:
  leaderboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/leaderboard.db
    ports:
      - "127.0.0.1:5000:8000"
    volumes:
      - leaderboard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  leaderboard-data:
